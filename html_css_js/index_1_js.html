<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>assignment1</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-family: Arial, Helvetica, sans-serif;
      }
      .container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 1rem;
        margin-top: 5rem;
        border: 1px solid black;
        padding: 1rem;
        border-radius: 5px;
      }
      input {
        padding: 0.5rem 1rem;
        border-radius: 5px;
        outline: none;
        border: 1px solid black;
      }
      #add-btn {
        width: 100%;
        padding: 0.5rem 0;
        font-weight: bold;
        background-color: lightgreen;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
      #add-btn:hover {
        opacity: 0.7;
      }
      .table-container {
        width: 50%;
        background-color: rgb(231, 231, 231);
        padding: 1rem;
        margin-top: 3rem;
      }
      .table {
        border: 1px solid black;
        width: 100%;
      }
      .table tr {
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 1rem 0;
      }
      .table th {
        width: 100%;
      }
      .table td {
        text-align: center;
        width: 100%;
      }
      .msg {
        color: red;
        padding: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <input type="text" placeholder="Enter Name" id="name" />
      <input type="text" placeholder="Your age" id="age" />
      <input type="text" placeholder="Phone number" id="number" />
      <button id="add-btn">Add</button>
    </div>
    <div class="msg"></div>

    <div class="table-container">
      <table class="table">
        <tr>
          <th>Name</th>
          <th>Age</th>
          <th>Phone Number</th>
        </tr>
      </table>
    </div>

    <script>
      let name = document.querySelector("#name");
      let age = document.querySelector("#age");
      let number = document.querySelector("#number");
      let addButton = document.querySelector("#add-btn");
      let msg = document.querySelector(".msg");
      let table = document.querySelector(".table");

      addButton.addEventListener("click", () => {
        let td1 = name.value;
        let td2 = age.value;
        let td3 = number.value;
        if (name.value === "" && age.value === "" && number.value === "") {
          msg.innerHTML = "No data to add";
        } else {
          let tr = document.createElement("tr");
          tr.innerHTML = `
         <tr>
          <td>${td1}</td>
          <td>${td2}</td>
          <td>${td3}</td>
        </tr>
        `
          table.appendChild(tr);
          name.value = "";
          age.value = "";
          number.value = "";
        }
      });
    </script>
  </body>
</html>
