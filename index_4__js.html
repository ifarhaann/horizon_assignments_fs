<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>assignment 3</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      body {
        font-family: Arial, Helvetica, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
      h2{
        margin-top: 3rem;
      }
      .container {
        width: 50%;
        background-color: rgb(205, 204, 204);
        box-shadow: 1px 1px 10px black;
        margin-top: 2rem;
        padding: 1rem;
        display: flex;
        flex-direction: column;
      }
      .input-card {
        padding: 1rem;
        width: 100%;
        display: flex;
        justify-content: center;
        gap: 1rem;
      }
      #question {
        padding: 0.5rem 0.7rem;
        border-radius: 3px;
        border: 1px solid black;
        outline: none;
      }
      #btn {
        padding: 0.5rem 1rem;
        background-color: rgb(26, 42, 37);
        border-radius: 3px;
        border: 1px solid black;
        color: rgb(255, 255, 255);
        font-weight: bold;
        cursor: pointer;
      }
      .hidden {
        display: none;
      }
      .error {
        color: rgb(231, 89, 89);
        text-align: center;
        margin-top: 2rem;
      }
      .result{
        display: flex;
        justify-content: center;
        align-items: center;
      }
     
    table ,th, td {
        margin-top: 1rem;
        border: 1px solid black;
        border-collapse: collapse;
        padding: 0.3rem 0.6rem;
        background-color: white;
      }
    </style>
  </head>
  <body>
    <h2>Check your question's content safety here</h2>
    <div class="container">
      <div class="input-card">
        <input type="text" placeholder="Enter a question" id="question" />
        <button id="btn">Check</button>
      </div>
      <div class="result"></div>
      <div class="load hidden">Checking question...</div>
      <div class="error hidden"></div>
    </div>

    <script>
      let input = document.querySelector("input");
      let checkBtn = document.querySelector("button");
      let resultShow = document.querySelector(".result");
      let errorMsg = document.querySelector(".error");
      let load = document.querySelector(".load")
      checkBtn.addEventListener("click", async function (e) {
        e.preventDefault();
        load.classList.remove("hidden")
        try {
          let question = input.value.trim();
        if (!question) {
          errorMsg.textContent = "Enter question";
          errorMsg.classList.remove("hidden");
          return;
        }
        errorMsg.textContent = "";
        errorMsg.classList.add("hidden");
        let data = await checkQuestion(question);
        showOnDisplay(data);

        input.value = "";
        } catch (error) {
          
        } finally{
          load.classList.add("hidden")
        }
      });
  function sendData(apiKey,question) {
    let send  = {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Ocp-Apim-Subscription-Key": apiKey,
            },
            body: JSON.stringify({
              text: question,
            }),
          }
      return send
  }
      async function checkQuestion(question) {
        let apiKey = `azure_key`;
        let endpoint = `https://my-content-check.cognitiveservices.azure.com/contentsafety/text:analyze?api-version=2024-09-01`;
        try {
          let response = await fetch(endpoint, sendData(apiKey,question) );
          if (!response.ok) {
            throw new Error("Request Failed");
          }
          let data = await response.json();
          console.log(data);
          return data;
        } catch (error) {
          console.log(error);
        }
      }

      function showOnDisplay(data) {
        resultShow.innerHTML = "";

        let resultIs = data.categoriesAnalysis;
        let table = document.createElement("table");
        table.innerHTML = ` <table>
        <tr>
          <th>Category</th>
          <th>Severity</th>
        </tr>
      </table>`;
        resultIs.map((item) => {
           let tr = document.createElement("tr");
          tr.innerHTML = `
          <tr>
          <td>${item.category}</td>
          <td>${item.severity}</td>
         </tr>
          `;
          table.appendChild(tr);
        });
      table.classList.add("tableData")
        resultShow.append(table)
      }
    </script>
  </body>
</html>
